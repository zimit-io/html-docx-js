name: Dependency Age Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dependency-age-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check dependency age (block packages published less than 24h ago)
        run: python3 .github/scripts/check_dependency_age.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
